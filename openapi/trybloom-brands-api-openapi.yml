  /brands/{id}/logo:
    put:
      operationId: brands.updateLogo
      summary: Update brand logo (url)
      description: Update the logo for a brand session. Downloads and validates the logo, then starts (or restarts) visual DNA extraction and returns status "analyzing". For image-based onboarding the stitched collage is preserved as the visual identity, so no extraction runs and status "ready" is returned. Common when status is "logo_required", but also works for replacing an existing logo on ready brands.
      tags:
      - Brands
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Brand ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                logoUrl:
                  type: string
                  format: uri
                  description: Direct URL to the logo image (PNG, JPG, SVG, or WEBP)
              required:
              - logoUrl
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        enum:
                        - analyzing
                        - ready
                    required:
                    - id
                    - status
                required:
                - data
        '400':
          description: '400'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: INVALID_LOGO
                    status:
                      const: 400
                    message:
                      type: string
                      default: Logo could not be downloaded or validated
                    data: {}
