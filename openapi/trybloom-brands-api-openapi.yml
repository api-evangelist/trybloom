  /brands/{id}:
    get:
      operationId: brands.get
      summary: Get a brand
      description: Get a brand by ID. When status is "ready", the brand can generate images. If status is "logo_required", provide a logo via PUT /brands/{id}/logo. A failed brand includes public-safe failure details. Use wait=true to hold the connection until ready, logo_required, or failed; a timeout returns the current analyzing resource.
      tags:
      - Brands
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Brand ID
      - name: wait
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - enum:
            - '0'
            - '1'
            - 'true'
            - 'false'
          default: false
          description: Hold the connection until the resource reaches a terminal status
        style: deepObject
        explode: true
        allowEmptyValue: true
        allowReserved: true
      - name: timeout
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 295
          default: 120
          description: Max seconds to wait (default 120, max 295)
        allowEmptyValue: true
        allowReserved: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        enum:
                        - analyzing
                        - ready
                        - logo_required
                        - failed
                      failure:
                        anyOf:
                        - type: object
                          properties:
                            code:
                              enum:
                              - INVALID_URL
                              - SCRAPE_FAILED
                              - INSTAGRAM_FETCH_FAILED
                              - INTERNAL_ERROR
                              - VISUAL_DNA_FAILED
                            message:
                              type: string
                          required:
                          - code
                          - message
                        - type: 'null'
                      name:
                        type: string
                      url:
                        type: string
                      logoUrl:
                        anyOf:
                        - type: string
                        - type: 'null'
                      logoError:
                        type: string
                      colors:
                        type: array
                        items:
                          type: string
                      fonts:
                        type: array
                        items:
                          type: string
                      aesthetic:
                        anyOf:
                        - type: string
                        - type: 'null'
                      summary:
                        anyOf:
                        - type: string
                        - type: 'null'
                      workspaceId:
                        anyOf:
                        - type: string
                        - type: 'null'
                      workspaceName:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                        x-native-type: date
                    required:
                    - id
                    - status
                    - failure
                    - name
                    - url
                    - logoUrl
                    - colors
                    - fonts
                    - aesthetic
                    - summary
                    - workspaceId
                    - workspaceName
                    - createdAt
                required:
                - data
        '401':
          description: '401'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: UNAUTHORIZED
                    status:
                      const: 401
                    message:
                      type: string
                      default: Invalid or missing API credentials
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
        '403':
          description: '403'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: FORBIDDEN
                    status:
                      const: 403
                    message:
                      type: string
                      default: Plan upgrade required
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
