  /brands/{id}/logo/file:
    put:
      operationId: brands.uploadLogoFile
      summary: Update brand logo (file)
      description: Update the logo for a brand by uploading raw bytes (multipart/form-data). Use this when the logo is local — for remote URLs, use PUT /brands/{id}/logo. Validates and processes the file (SVG and AVIF are converted to PNG; transparency gets an optimal background), then starts (or restarts) visual DNA extraction.
      tags:
      - Brands
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Brand ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  anyOf:
                  - type: string
                    contentMediaType: image/png
                  - type: string
                    contentMediaType: image/jpeg
