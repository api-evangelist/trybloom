  /images/generations:
    post:
      operationId: images.generate
      summary: Generate an image
      description: Start an image generation. Returns immediately with the image ID(s). Poll GET /images/{id} to check status and retrieve the result. Optionally include referenceImageIds for style/content guidance.
      tags:
      - Images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Description of the image to generate (1–2000 chars)
                brandSessionId:
                  type: string
                  format: uuid
                  description: Brand session ID (from GET /brands)
                aspectRatio:
                  enum:
                  - '1:1'
                  - '2:3'
                  - '3:2'
                  - '3:4'
                  - '4:3'
                  - '4:5'
                  - '5:4'
                  - '9:16'
                  - '16:9'
                  - '21:9'
                  description: Aspect ratio. One of "1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9"
                imageSize:
                  enum:
                  - 2K
                  - 4K
                  default: 2K
                  description: '"2K" (default, 1 credit) or "4K" (2 credits, Plus/Pro)'
                model:
                  enum:
                  - fast
                  - standard
                  - pro
                  description: Model tier. "fast" (cheaper/faster), "standard" (mid tier), or "pro" (default, highest quality).
                variantCount:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Number of variant images to generate (1-5, default 1). Each variant costs the same credits.
                referenceImageIds:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: uuid
                  description: IDs of uploaded or generated images to use as style/content references (max 10)
              required:
              - prompt
              - brandSessionId
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ids:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          format: uuid
                      variantGroupId:
                        anyOf:
                        - type: string
                          format: uuid
                        - type: 'null'
                      status:
                        const: pending
                    required:
                    - ids
                    - variantGroupId
                    - status
                required:
                - data
        '400':
          description: '400'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
