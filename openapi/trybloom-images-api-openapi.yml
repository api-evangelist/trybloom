  /images/search:
    post:
      operationId: images.search
      summary: Semantic Search
      description: Semantic search (powered by vector embeddings) over the brand session's library images, ranked nearest-first. Library images are those whose `source` is `uploaded` (added by the user) or `scraped` (pulled in during onboarding) — generated images are excluded. Pass `cursor` from the previous response to paginate.
      tags:
      - Images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brandSessionId:
                  type: string
                  format: uuid
                  description: Brand session UUID to search within
                query:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Visual concept to search for. Plain noun phrases work best — e.g., 'drone in flight', 'team working at desks', 'product on white background'.
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 10
                  description: Max results to return (default 10, max 50)
                cursor:
                  type: string
                  description: Pagination cursor from a previous response's nextCursor
                maxDistance:
                  type: number
                  minimum: 0
                  maximum: 2
                  default: 0.7
                  description: Cosine-distance cutoff (smaller = stricter). Default 0.7 gives good relevance for most queries; loosen for long-tail matches, tighten for stricter recall. Distances above this threshold are dropped.
              required:
              - brandSessionId
              - query
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      query:
                        type: string
                      candidates:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            url:
                              type: string
                            description:
                              type: string
                            width:
                              anyOf:
                              - type: number
                              - type: 'null'
                            height:
                              anyOf:
                              - type: number
                              - type: 'null'
                            aspectRatio:
                              anyOf:
                              - enum:
                                - '1:1'
                                - '2:3'
                                - '3:2'
                                - '3:4'
                                - '4:3'
                                - '4:5'
                                - '5:4'
                                - '9:16'
                                - '16:9'
                                - '21:9'
                              - type: 'null'
                            distance:
                              type: number
                              description: Opaque relevance score; smaller = closer.
                          required:
                          - id
                          - url
                          - description
                          - width
                          - height
                          - aspectRatio
                          - distance
                      nextCursor:
                        anyOf:
                        - type: string
                        - type: 'null'
                      hasMore:
                        type: boolean
                    required:
                    - query
                    - candidates
                    - nextCursor
                    - hasMore
                required:
                - data
        '400':
          description: '400'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: INVALID_CURSOR
                    status:
                      const: 400
                    message:
                      type: string
