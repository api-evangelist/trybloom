                          - '3:2'
                          - '3:4'
                          - '4:3'
                          - '4:5'
                          - '5:4'
                          - '9:16'
                          - '16:9'
                          - '21:9'
                        - type: 'null'
                      width:
                        anyOf:
                        - type: number
                        - type: 'null'
                      height:
                        anyOf:
                        - type: number
                        - type: 'null'
                      actionType:
                        anyOf:
                        - enum:
                          - generation
                          - edit
                          - resize
                          - variant
                          - recreate
                          - remove-background
                          - vectorize
                        - type: 'null'
                      variantGroupId:
                        anyOf:
                        - type: string
                          format: uuid
                        - type: 'null'
                      workspaceId:
                        anyOf:
                        - type: string
                        - type: 'null'
                      workspaceName:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                        x-native-type: date
                    required:
                    - id
                    - source
                    - status
                    - failureReason
                    - prompt
                    - description
                    - imageUrl
                    - aspectRatio
                    - width
                    - height
                    - actionType
                    - variantGroupId
                    - workspaceId
                    - workspaceName
                    - createdAt
                required:
                - data
        '401':
          description: '401'
