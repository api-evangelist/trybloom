undocumented_changes:
  note: >-
    Observed by diffing the live OpenAPI (https://www.trybloom.ai/api/v1/spec.json)
    fetched 2026-08-13 against the copy harvested 2026-07-21. These are real API
    changes that shipped with no changelog entry — recorded here as evidence of
    what the empty changelog is not telling consumers, not as provider-published
    release notes.
  observed:
    - date_observed: '2026-08-13'
      change: >-
        A new error code ACCOUNT_BANNED (HTTP 403, default message "This account
        has been suspended.") was added to the 403 response of every operation in
        the spec.
      breaking: false
      type: addition
      evidence: openapi/_original/trybloom-api-openapi.json
    - date_observed: '2026-08-13'
      change: Operation surface unchanged — the same 23 operationIds across 19 paths.
      breaking: false
      type: none
