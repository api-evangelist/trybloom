providerId: trybloom
generated: '2026-08-13'
method: probed
source: https://www.trybloom.ai/changelog
description: >-
  Bloom launched a public changelog surface — a /changelog page linked from the
  site footer and an Atom feed at /changelog/rss.xml — between 2026-07-21 (when
  this repo last probed it and got a 404) and 2026-08-13. The surface is live
  but EMPTY: the page renders "No updates yet." and the feed carries zero
  <entry> elements with <updated>1970-01-01T00:00:00.000Z</updated>. There is
  therefore no dated release history to record for the API, even though the API
  itself demonstrably changed in that window (see undocumented_changes below).
