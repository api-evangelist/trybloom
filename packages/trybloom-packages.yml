description: >-
  Bloom publishes NO first-party SDK on any package registry. The supported
  integration paths are the REST API (live OpenAPI 3.1 spec for codegen), the
  hosted MCP server, and workflow tools over plain HTTP. One third-party
  community SDK exists on npm. Bloom's own distributed artifacts are an Agent
  Skill (GitHub repo + ZIP release, no registry) and copy-ready templates.
