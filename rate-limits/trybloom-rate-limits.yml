description: >-
  Bloom API rate limits are enforced per API key on a sliding window. Limits
  above the published ceiling are raised on request via support@trybloom.ai
  for sustained-volume or spiky batch integrations.
sources:
  - https://www.trybloom.ai/docs/api/usage-limits
responseCodes:
  throttled: 429
errorCodes:
  throttled: TOO_MANY_REQUESTS
limits:
  - name: Requests per API key
    scope: api-key
    metric: requests_per_minute
    limit: 120
    timeFrame: minute
    window: sliding
