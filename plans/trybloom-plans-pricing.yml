description: >-
  Bloom is credit-priced: every plan grants monthly image credits (2K image =
  1 credit, 4K = 2 credits; variants multiply the cost) and API + MCP access is
  included in every paid plan. There is no free plan; new accounts get 10 free
  credits to try the API. Plan credits refresh monthly on the billing
  anniversary and do not roll over; one-off top-ups (20-200 credits) never
  expire. Annual billing is discounted (Scale shows 28% off).
sources:
  - https://www.trybloom.ai/pricing/
  - https://www.trybloom.ai/docs/api/usage-limits
