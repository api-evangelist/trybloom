aid: trybloom
name: Bloom
description: >-
  Bloom (trybloom.ai) is the brand layer for agents — a Y Combinator
  (Spring 2026) company founded by Ray Fitzgerald that turns a brand into
  infrastructure any agent, app, or platform can call. Point Bloom at a
  website or Instagram profile and it ingests the brand — logo, palette,
  type, tone, visual DNA — then generates on-brand images (edit, resize,
  background removal, vectorize to SVG, 2K/4K, variants) through a web app,
  a credit-priced REST API with a live OpenAPI 3.1 contract, and an official
  hosted MCP server with OAuth sign-in for Claude, ChatGPT, Cursor, and other
  agents.
